name: Publish verified odds
on:
  workflow_dispatch:
    inputs:
      specials:
        description: 'Special bets JSON array'
        required: true
        type: string
      bombs:
        description: 'Bomba oran JSON array'
        required: true
        type: string
      source_url:
        description: 'Exact source URL verified by operator'
        required: true
        type: string
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate operator data
        env:
          SPECIALS: ${{ inputs.specials }}
          BOMBS: ${{ inputs.bombs }}
          SOURCE_URL: ${{ inputs.source_url }}
        run: |
          python - <<'PY'
          import os,json,datetime,urllib.parse,pathlib
          specials=json.loads(os.environ['SPECIALS'])
          bombs=json.loads(os.environ['BOMBS'])
          source=os.environ['SOURCE_URL'].strip()
          if not isinstance(specials,list) or not isinstance(bombs,list) or not specials or not bombs: raise ValueError('Two nonempty lists required')
          for row in specials:
              if not isinstance(row,dict) or any(not str(row.get(k,'')).strip() for k in ('group','match','condition','odd')):raise ValueError('Invalid special bet')
          for row in bombs:
              if not isinstance(row,dict) or any(not str(row.get(k,'')).strip() for k in ('group','match','condition','previous','current')):raise ValueError('Invalid bomba oran')
          parsed=urllib.parse.urlparse(source)
          if parsed.scheme!='https' or not parsed.hostname:raise ValueError('Valid HTTPS source URL required')
          tz=datetime.timezone(datetime.timedelta(hours=3))
          now=datetime.datetime.now(tz)
          file=pathlib.Path('data/latest.json')
          old=json.loads(file.read_text(encoding='utf-8'))
          old.update(date=now.date().isoformat(),status='manual',source=parsed.hostname,source_url=source,checked_at=now.isoformat(),message='Operatör tarafından kaynaktan kontrol edilip yayımlanan kayıt; otomatik canlı veri değildir.',specials=specials,bombs=bombs)
          file.write_text(json.dumps(old,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/latest.json
          git diff --cached --quiet || (git commit -m 'Publish manually verified odds' && git push)
