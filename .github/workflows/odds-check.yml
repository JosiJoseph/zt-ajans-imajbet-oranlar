name: Oran kaynak kontrolü
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-and-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: python -m playwright install chromium --with-deps
      - run: python scripts/check.py
      - name: Publish only validated data
        run: |
          git config user.name 'zt-ajans-monitor'
          git config user.email 'zt-ajans-monitor@users.noreply.github.com'
          git add data/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Update verified odds source"
            git push
          fi
